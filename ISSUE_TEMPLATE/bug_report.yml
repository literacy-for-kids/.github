name: Bug report
description: Report a broken link, site error, or build failure.
labels: ["bug"]
body:
  - type: input
    id: repo
    attributes:
      label: Which repo or site?
      placeholder: "e.g. computer_literacy_for_kids, literacy_for_kids hub"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to...\n2. Click...\n3. See error"
    validations:
      required: true
